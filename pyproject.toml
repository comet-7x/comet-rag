[project]
name = "comet-rag"
version = "0.2.0.dev0"
description = "Composable document ingestion and retrieval components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comet_rag"]

[tool.hatch.build.targets.sdist]
include = ["/comet_rag", "/tests", "/docs", "/AGENTS.md", "/Makefile", "/docker-compose.yml", "/uv.lock", "/.pre-commit-config.yaml", "/.python-version"]

[dependency-groups]
dev = [
    "commitizen>=4.8.2",
    "lxml-stubs>=0.5.1",
    "pre-commit>=4.2.0",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "python-docx>=1.2.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["comet_rag"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tmp", "temp", "draft", "poc"]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4", "SIM", "I", "UP", "PIE", "PGH", "PYI"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# 测试中的 assert 是预期行为；其他 Bandit 检查仍覆盖 tests。
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]

[tool.pyright]
include = ["comet_rag", "tests"]
exclude = ["**/__pycache__", "tmp", "temp", "draft", "poc", "logs", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple"
default = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
allowed_prefixes = ["doc", "feat", "Merge", "dependency", "Revert"]
