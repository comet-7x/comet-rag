[project]
name = "comet-rag"
version = "0.2.0.dev0"
description = "Composable document ingestion and retrieval components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.0",
]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.40", "asyncpg>=0.30.0"]
milvus = ["pymilvus>=2.6.0,<2.7"]
models = ["httpx>=0.28.1"]
sources = ["httpx>=0.28.1", "boto3>=1.38.0"]
images = ["pillow>=11.2.1"]
local-models = ["torch>=2.6.0", "transformers>=4.51.0,<5", "pillow>=11.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comet_rag"]

[tool.hatch.build.targets.sdist]
include = ["/comet_rag", "/tests", "/docs", "/examples", "/evals", "/scripts", "/AGENTS.md", "/Makefile", "/docker-compose.yml", "/uv.lock", "/.pre-commit-config.yaml", "/.python-version"]

[dependency-groups]
dev = [
    "asyncpg>=0.30.0",
    "boto3>=1.38.0",
    "pillow>=11.2.1",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.40",
    "pymilvus>=2.6.0,<2.7",
    "commitizen>=4.8.2",
    "lxml-stubs>=0.5.1",
    "pre-commit>=4.2.0",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "python-docx>=1.2.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = ["integration: explicitly selected real backend and service checks"]

[tool.coverage.run]
source = ["comet_rag"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tmp", "temp", "draft", "poc"]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4", "SIM", "I", "UP", "PIE", "PGH", "PYI"]
ignore = ["E501", "SIM102", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# 测试中的 assert 是预期行为；其他 Bandit 检查仍覆盖 tests。
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["comet_rag", "tests", "examples", "evals", "scripts"]
exclude = ["**/__pycache__", "tmp", "temp", "draft", "poc", "logs", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple"
default = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
allowed_prefixes = ["doc", "feat", "Merge", "dependency", "Revert"]
