[project]
name = "comet-rag"
version = "0.1.0"
description = "Comet-RAG: A RAG application framework"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "loguru>=0.7.3",
    "snowflake>=1.12.0",
    "openai>=2.30.0",
    "httpx>=0.27.0",
    "magika>=1.0.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.2",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "ruff>=0.6.0",
]

[tool.ruff.lint]
select = [
    "E",             # pycodestyle (error)
    "F",             # pyflakes
    "B",             # bugbear
    "S",             # flake8-bandit
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "I",             # isort
    "UP",            # pyupgrade
    "PIE",           # flake8-pie
    "PGH",           # pygrep-hooks
    "PYI",           # flake8-pyi
]

ignore = [
    "E501",    # line-too-long
    "W291",    # Trailing whitespace
    "E241",    # Multiple spaces after comma
    "E221",    # Multiple spaces before operator
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"comet_rag/engines/chunkers/separators.py" = [
    "E261",  # Inline comment spacing — intentional alignment for readability
    "E262",  # Inline comment format — intentional alignment for readability
]

[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple"
default = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
allowed_prefixes = ["doc", "feat", "Merge", "dependency", "Revert"]
