name: comet-rag-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comet_v2
      POSTGRES_PASSWORD: ${COMET_V2_POSTGRES_PASSWORD:-comet-v2-local}
      POSTGRES_DB: comet_rag_v2
    ports:
      - "127.0.0.1:${COMET_V2_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet_v2 -d comet_rag_v2"]
      interval: 3s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${COMET_V2_MINIO_USER:-comet-v2}
      MINIO_ROOT_PASSWORD: ${COMET_V2_MINIO_PASSWORD:-comet-v2-local}
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.6.23
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${COMET_V2_MINIO_USER:-comet-v2}
      MINIO_SECRET_ACCESS_KEY: ${COMET_V2_MINIO_PASSWORD:-comet-v2-local}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${COMET_V2_MILVUS_PORT:-29530}:19530"
      - "127.0.0.1:${COMET_V2_MILVUS_HEALTH_PORT:-29091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  etcd-data:
  minio-data:
  milvus-data:
