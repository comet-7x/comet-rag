name: Tests

on: [push, pull_request]

jobs:
  package:
    name: 构建与核心安装
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 构建 wheel 与源码包
        run: uv build
      - name: 在独立环境安装 wheel
        run: |
          uv venv "$RUNNER_TEMP/comet-rag-core" --python 3.12
          uv pip install --python "$RUNNER_TEMP/comet-rag-core/bin/python" dist/*.whl
      - name: 核心模块在仓库外可用
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/comet-rag-core/bin/python" -I -c '
          import sys
          from importlib.metadata import distribution
          from comet_rag.documents.parsers import ArchiveLimits
          from comet_rag.retrieval import reciprocal_rank_fusion
          assert ArchiveLimits().max_members > 0
          assert reciprocal_rank_fusion({"dense": ["a"], "keyword": ["a"]})[0].unit_id == "a"
          assert not distribution("comet-rag").entry_points
          assert not {"fastapi", "redis", "arq", "pymilvus", "sqlalchemy", "openai"} & sys.modules.keys()
          '

  typecheck:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pyright

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=comet_rag --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
