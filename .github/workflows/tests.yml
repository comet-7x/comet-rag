name: Tests

on: [push, pull_request]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 这个 job 是 spec A1 的守门人：只装核心依赖（不带任何 extras）。
  # 一旦有人往 engines/ 里加了基础设施依赖，这里会立刻红 ——
  # 而在装了全部 extras 的开发机上是察觉不到的。
  # ───────────────────────────────────────────────────────────────────────────
  core-only:
    name: 仅核心依赖（A1 守门）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 只装核心依赖
        run: uv sync --no-default-groups

      # 同时验证稳定公共入口、原子 Chunker 和 infrastructure 延迟导入边界。
      - name: 库可独立使用
        run: |
          uv run --no-sync python -c "
          from comet_rag.engines.chunkers import RecursiveChunker
          from comet_rag.engines.indexing import HierarchyBuilder
          from comet_rag.ports import NormalizedDocument
          from comet_rag.loaders import AsyncAutoLoader, AsyncLocalLoader, AutoLoader, LocalLoader
          from comet_rag.pipeline import AsyncPipeline, Pipeline
          import sys
          chunks = RecursiveChunker(chunk_size=50, chunk_overlap=10).chunk('x' * 300)
          assert len(chunks) > 1, f'300 字符按 50 切却只得到 {len(chunks)} 块'
          assert all(len(c) <= 50 for c in chunks), '有块超过了 chunk_size'
          hierarchy = HierarchyBuilder(RecursiveChunker(100), RecursiveChunker(50)).split(NormalizedDocument(markdown='x' * 300))
          assert len(hierarchy.parents) == 3 and len(hierarchy.children) == 6
          assert AutoLoader and LocalLoader and AsyncAutoLoader and AsyncLocalLoader
          assert Pipeline and AsyncPipeline
          assert 'comet_rag.infrastructure.sources.s3' not in sys.modules
          print(f'核心依赖下引擎可用 ✓（{len(chunks)} 块）')
          "

  # ───────────────────────────────────────────────────────────────────────────
  # 独立成 job 而不是塞进 unit：类型错误与测试失败是两类信号，串在一条 job 里
  # 前者会把后者挡在后面（反之亦然），一次 push 只能看到一半问题。
  # 分开还能并行跑，反馈更快。
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: 类型检查（pyright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 必须装全 extras：少一个 extra，pyright 就会把对应的 import 报成
      # "无法解析"，于是这个 job 变成检查依赖装没装全，而不是检查类型。
      - name: 安装依赖
        run: uv sync --all-groups --all-extras

      # 范围与 exclude 都在 pyproject.toml 的 [tool.pyright] 里，
      # 这里不传参数 —— 免得 CI 与本地 `make typecheck` 查的不是同一批文件。
      - name: pyright
        run: uv run pyright

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --all-extras

      - name: 单元测试
        # 默认 addopts 已排除 integration / e2e / benchmark
        run: uv run pytest --cov=comet_rag --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: 内存端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --all-groups --all-extras
      - name: 建库、入库、检索与降级
        run: uv run pytest tests/e2e -m e2e

  task-integration:
    name: 真实任务后端与崩溃恢复
    runs-on: ubuntu-latest
    env:
      COMET_TEST_POSTGRES_DSN: postgresql+asyncpg://comet:comet@localhost:5432/comet_rag_ci
      COMET_TEST_REDIS_URL: redis://localhost:6379/0
      COMET_TEST_REQUIRE_SERVICES: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comet
          POSTGRES_PASSWORD: comet
          POSTGRES_DB: comet_rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comet -d comet_rag_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --all-groups --all-extras
      - name: 迁移独立 CI 数据库
        run: uv run alembic -x "dsn=$COMET_TEST_POSTGRES_DSN" upgrade head
      - name: 单元覆盖率基线
        run: uv run pytest tests/unit --cov=comet_rag --cov-report= --cov-fail-under=70
      - name: 追加内存端到端覆盖率
        run: uv run pytest tests/e2e -m e2e --cov=comet_rag --cov-append --cov-report= --cov-fail-under=70
      - name: 真实执行器、存储契约与进程接管
        run: >-
          uv run pytest tests/integration/test_executor_arq.py
          tests/integration/test_store_postgres.py
          tests/integration/test_document_store_postgres.py
          tests/integration/test_crash_recovery.py
          tests/integration/test_workers_split.py
          tests/integration/test_runner_registry_workers.py -m integration
          --cov=comet_rag --cov-append --cov-report=term-missing --cov-fail-under=70
      - name: 任务框架三层合并覆盖率至少 90%
        run: uv run coverage report --include="comet_rag/tasks/*" --fail-under=90

  revision-integration:
    name: 真实 Milvus 与 revision 可见性
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMET_TEST_POSTGRES_DSN: postgresql+asyncpg://comet:comet@localhost:5432/comet_revision_ci
      COMET_TEST_REDIS_URL: redis://localhost:6379/0
      COMET_TEST_MILVUS_URI: http://127.0.0.1:29530
      COMET_TEST_REQUIRE_SERVICES: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comet
          POSTGRES_PASSWORD: comet
          POSTGRES_DB: comet_revision_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comet -d comet_revision_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --all-groups --all-extras
      - name: 启动固定版本隔离 Milvus
        run: >-
          docker compose -p comet-rag-milvus-ci -f .github/milvus/compose.yml
          up -d --wait --wait-timeout 180
      - name: 创建隔离向量测试库
        run: |
          uv run python -c '
          import os
          from pymilvus import MilvusClient
          client = MilvusClient(uri=os.environ["COMET_TEST_MILVUS_URI"], timeout=10)
          try:
              client.create_database("zhihao_test_database")
          finally:
              client.close()
          '
      - name: 迁移独立 CI 数据库
        run: uv run alembic -x "dsn=$COMET_TEST_POSTGRES_DSN" upgrade head
      - name: 向量契约、Strong 与双存储故障恢复
        run: >-
          uv run pytest tests/integration/test_vectorstore_milvus.py
          tests/integration/test_milvus_async_lifecycle.py
          tests/integration/test_document_store_postgres.py
          tests/integration/test_revision_lifecycle.py
          tests/integration/test_revision_activation_recovery.py
          tests/integration/test_revision_gc_recovery.py -m integration
      - name: 失败时记录隔离服务日志
        if: failure()
        run: docker compose -p comet-rag-milvus-ci -f .github/milvus/compose.yml logs --tail 100
      - name: 清理隔离服务与测试数据
        if: always()
        run: docker compose -p comet-rag-milvus-ci -f .github/milvus/compose.yml down --volumes
