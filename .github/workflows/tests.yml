name: Tests

on: [push, pull_request]

jobs:
  package:
    name: 构建与核心安装
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 构建 wheel 与源码包
        run: uv build
      - name: 在独立环境安装 wheel
        run: |
          uv venv "$RUNNER_TEMP/comet-rag-core" --python 3.12
          uv pip install --python "$RUNNER_TEMP/comet-rag-core/bin/python" dist/*.whl
      - name: 核心组件在仓库外跨进程读回
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/comet-rag-core/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_core_install.py" --output-dir "$RUNNER_TEMP/comet-rag-roundtrip" --phase write
          "$RUNNER_TEMP/comet-rag-core/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_core_install.py" --output-dir "$RUNNER_TEMP/comet-rag-roundtrip" --phase read

  typecheck:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pyright

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=comet_rag --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  integration:
    name: PostgreSQL、Milvus 与 HTTP 实际集成
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMET_MILVUS_URI: http://127.0.0.1:29530
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: 启动本次 runner 后端并验证真实协议
        shell: bash
        run: |
          export COMET_V2_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export COMET_RAG_TEST_POSTGRES_URL="postgresql+asyncpg://comet_v2:${COMET_V2_POSTGRES_PASSWORD}@127.0.0.1:15432/comet_rag_v2"
          docker compose up -d --wait --wait-timeout 240
          uv run --locked pytest tests/integration/test_postgres.py tests/integration/test_milvus.py tests/integration/test_remote_sources.py tests/integration/test_embedding_http.py tests/integration/test_http_response_hooks.py -k 'not real_s3' -q
      - name: 保留后端失败日志
        if: failure()
        run: docker compose logs --no-color
