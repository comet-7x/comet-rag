name: Tests

on: [push, pull_request]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 这个 job 是 spec A1 的守门人：只装核心依赖（不带任何 extras）。
  # 一旦有人往 engines/ 里加了基础设施依赖，这里会立刻红 ——
  # 而在装了全部 extras 的开发机上是察觉不到的。
  # ───────────────────────────────────────────────────────────────────────────
  core-only:
    name: 仅核心依赖（A1 守门）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 只装核心依赖
        run: uv sync --no-default-groups

      # chunk_overlap 必须显式给：默认是 150，配上 chunk_size=50 会被库正确地
      # 拒绝（重叠不能 ≥ 分块大小）。这一行曾经写成 `TextChunker(chunk_size=50)`
      # 并让本 job 从建立起就是红的 —— 分支一直没推，CI 也就一直没跑过。
      - name: 库可独立使用
        run: |
          uv run python -c "
          from comet_rag.engines.pipelines import Pipeline
          from comet_rag.engines.chunkers import TextChunker
          chunks = TextChunker(chunk_size=50, chunk_overlap=10).chunk('x' * 300)
          assert len(chunks) > 1, f'300 字符按 50 切却只得到 {len(chunks)} 块'
          assert all(len(c) <= 50 for c in chunks), '有块超过了 chunk_size'
          print(f'核心依赖下引擎可用 ✓（{len(chunks)} 块）')
          "

  # ───────────────────────────────────────────────────────────────────────────
  # 独立成 job 而不是塞进 unit：类型错误与测试失败是两类信号，串在一条 job 里
  # 前者会把后者挡在后面（反之亦然），一次 push 只能看到一半问题。
  # 分开还能并行跑，反馈更快。
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: 类型检查（pyright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 必须装全 extras：少一个 extra，pyright 就会把对应的 import 报成
      # "无法解析"，于是这个 job 变成检查依赖装没装全，而不是检查类型。
      - name: 安装依赖
        run: uv sync --all-groups --all-extras

      # 范围与 exclude 都在 pyproject.toml 的 [tool.pyright] 里，
      # 这里不传参数 —— 免得 CI 与本地 `make typecheck` 查的不是同一批文件。
      - name: pyright
        run: uv run pyright

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --all-extras

      - name: 单元测试
        # 默认 addopts 已排除 integration / e2e / benchmark
        run: uv run pytest --cov=comet_rag --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
